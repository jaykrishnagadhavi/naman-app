<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited to ABrainoConscious</title>
</head>
<body style="margin: 0; padding: 0; background-color: #040C0E; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #E1E8EA;">
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #040C0E; padding: 40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 560px; background-color: #081619; border: 1px solid #1A373E; border-radius: 16px; overflow: hidden; padding: 36px 32px;">
          <!-- Brand Header -->
          <tr>
            <td align="left" style="padding-bottom: 24px;">
              <span style="font-family: Georgia, serif; font-size: 22px; font-weight: bold; color: #F8FAFA;">ABrainoConscious</span>
              <span style="display: block; font-size: 11px; color: #8D9FA4; margin-top: 4px;">Platform Invitation</span>
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="left" style="padding-bottom: 16px;">
              <h1 style="margin: 0; font-family: Georgia, serif; font-size: 24px; font-weight: 700; color: #FFFFFF; line-height: 1.25;">You have been invited to join.</h1>
            </td>
          </tr>

          <!-- Message Body -->
          <tr>
            <td align="left" style="font-size: 14px; line-height: 1.6; color: #BAC7CA; padding-bottom: 28px;">
              <p style="margin: 0 0 12px 0;">
                You've received an invitation to access ABrainoConscious. Tap the button below to accept your invitation and activate your account.
              </p>
            </td>
          </tr>

          <!-- Primary CTA Button -->
          <tr>
            <td align="left" style="padding-bottom: 32px;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius: 10px; background-color: #F5871F;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; padding: 13px 28px; font-size: 13px; font-weight: 700; color: #040C0E; text-decoration: none; border-radius: 10px; letter-spacing: 0.2px;">
                      Accept Invitation &rarr;
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Fallback Link Notice -->
          <tr>
            <td align="left" style="font-size: 11px; line-height: 1.5; color: #556B71; border-top: 1px solid #1A373E; padding-top: 20px;">
              Direct URL: <a href="{{ .ConfirmationURL }}" style="color: #F5871F; text-decoration: underline; word-break: break-all;">{{ .ConfirmationURL }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
